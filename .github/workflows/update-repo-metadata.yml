name: Update repository metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-repo-metadata.yml
  workflow_dispatch:

permissions:
  administration: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Set repository description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description='Cyberpunk dark glass theme for VS Code and Cursor — neon lime, cyan, yellow, pink, orange and red accents.'

      - name: Replace repository topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/topics" \
            -H "Accept: application/vnd.github.mercy-preview+json" \
            --input - <<'EOF'
          {"names":["vscode-theme","cursor","cyberpunk","neon","dark-theme","color-theme","rainbow","glassmorphism","vs-code"]}
          EOF
